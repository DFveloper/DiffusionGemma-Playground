<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>diffusion-gemma chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>diffusion<span class="accent">·</span>gemma</h1>
    <span id="model-info">DiffusionGemma 26B-A4B · block diffusion · llama.cpp PR #24423</span>
    <span id="status" class="idle">idle</span>
  </header>

  <main>
    <div id="messages"></div>

    <form id="composer">
      <textarea id="input" rows="2" placeholder="Say something — watch it denoise…"
        autocomplete="off"></textarea>
      <div id="controls">
        <label>tokens <input id="p-tokens" type="number" value="256" min="32" max="2048" step="32" /></label>
        <label>max steps <input id="p-steps" type="number" value="48" min="4" max="256" /></label>
        <label>frame every <input id="p-interval" type="number" value="1" min="1" max="8" /> steps</label>
        <button id="reset" type="button" title="clear conversation context (/clear)">⟲ new chat</button>
        <button id="send" type="submit">denoise ⇢</button>
      </div>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
